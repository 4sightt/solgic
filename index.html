<!doctype html>
<html lang="en">
<head>
<!--
[BOYOUNG_INTERNAL_MEMO_TILE_STATES]
Tile semantics (IMPORTANT):
- '.' (t:'e', UI empty): UNOPENED / UNKNOWN cell. This is the ONLY type that the solver may propose SAFE/MINE for.
- '?' (t:'q', UI q): OPENED SAFE tile with UNKNOWN number (already opened; cannot be opened again). Treat as SAFE-fixed, NOT a candidate.
- number (t:'n', v=k): OPENED SAFE tile with known clue number k.
- 'F' (t:'f'): flagged mine (user mark / or confirmed mine depending on mode).

Rule: NEVER generate or display SAFE/MINE actions on '?' tiles.
End memo.
-->
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Solgic3-0.0.0</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111827; --panel2:#0f172a;
    --text:#e5e7eb; --muted:#9ca3af; --line:#243041;
    --accent:#60a5fa; --good:#22c55e; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background:var(--bg); color:var(--text)}
  .wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:18px}
  .app{width:min(1300px,96vw); display:flex; flex-direction:column; gap:12px}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:linear-gradient(180deg,rgba(17,24,39,.92),rgba(15,23,42,.92)); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .title{font-weight:700; letter-spacing:.2px; font-size:21px; display:flex; align-items:center; gap:10px}
  .pill{font-size:17px; color:var(--muted); padding:5px 9px; border:1px solid var(--line); border-radius:999px; background:rgba(0,0,0,.18)}
  .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
  select,button,input{background:rgba(0,0,0,.22); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:10px; font-size:17px}
  select{background-color:#0f1a2a} select option{background-color:#0f1a2a; color:#fff}
  button{cursor:pointer} button:hover{border-color:#334155}
  .main{display:grid; grid-template-columns:1fr 420px; gap:12px; position:relative}
  .card{background:linear-gradient(180deg,rgba(17,24,39,.92),rgba(15,23,42,.92)); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); overflow:hidden}
  .boardWrap{padding:14px; display:flex; align-items:center; justify-content:center; min-height:640px}
  .axisWrap{display:grid; grid-template-columns:34px auto; grid-template-rows:34px auto; gap:8px; align-items:start; justify-items:start}
  .axisCorner{width:34px; height:34px}
  .axis{color:var(--muted); font-weight:800; font-size:16px; user-select:none}
  .axisTop{display:grid; gap:8px}.axisLeft{display:grid; gap:8px}
  .axisTop .al,.axisLeft .al{display:flex; align-items:center; justify-content:center; width:68px; height:34px; border:1px solid rgba(148,163,184,.10); border-radius:10px; background:rgba(0,0,0,.10)}
  .axisLeft .al{width:34px; height:68px}
  .board{display:grid; gap:8px; outline:none}
  .cell{width:68px; height:68px; border:1px solid rgba(148,163,184,.22); border-radius:14px; background:rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; user-select:none; position:relative}
  .cell:hover{border-color:rgba(148,163,184,.38)}
  .cell.sel{border-color:rgba(96,165,250,.9); box-shadow:0 0 0 3px rgba(96,165,250,.18)}
  .cell.flag::after{content:"🚩"; position:absolute; font-size:36px}
  .cell.markSafe{outline:3px solid rgba(34,197,94,.85); background:rgba(34,197,94,.12)}
  .cell.markMine{outline:3px solid rgba(239,68,68,.85); background:rgba(239,68,68,.12)}
  .cell.flowerShade{background:rgba(148,163,184,.16)}
  .val{font-weight:800; letter-spacing:.3px; line-height:1}.val.big{font-size:36px}.val.q{color:#eab308}.val.n{color:var(--text)}
  .wgrid{width:100%; height:100%; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; padding:8px; gap:2px; place-items:center}
  .witem{font-weight:800; font-size:28px; line-height:1}.witem.q{color:#eab308}.witem.center{grid-column:1/span 2; grid-row:1/span 2; font-size:38px}.witem.bottomCenter{grid-column:1/span 2; grid-row:2}
  .witem.topLeft{grid-column:1; grid-row:1}.witem.topRight{grid-column:2; grid-row:1}.witem.bottomLeft{grid-column:1; grid-row:2}.witem.bottomRight{grid-column:2; grid-row:2}
  .ordBadge{position:absolute; top:6px; right:8px; font-size:13px; font-weight:900; color:rgba(103,232,249,.95); text-shadow:0 1px 2px rgba(0,0,0,.55); pointer-events:none}
  .inferBtn{position:absolute; left:0; top:0; padding:10px 14px; border-radius:10px; font-size:17px; font-weight:700; background:rgba(0,0,0,.30); border:1px solid var(--line); color:var(--text); box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:5}
  .sideHead{padding:12px 14px; border-bottom:1px solid var(--line)}
  .hBtn{appearance:none; background:transparent; border:none; padding:0; margin:0; cursor:pointer; text-align:left; line-height:1.1; font-weight:700; font-size:17px; color:var(--text)}
  .sideMeta{padding:10px 14px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px}
  .metaRow{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap}
  .sub{font-size:17px; color:var(--muted)}
  .sideBody{padding:12px 14px; height:596px; overflow:auto; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-size:17px; color:#d1d5db; white-space:pre-wrap; word-break:break-word; overflow-x:hidden}
  .hint{padding:10px 14px; border-top:1px solid var(--line); color:var(--muted); font-size:17px; line-height:1.35}
  .kbd{border:1px solid var(--line); padding:1px 6px; border-radius:7px; background:rgba(0,0,0,.18); color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <div class="topbar">
      <div class="title">
        <span>Solgic 3</span>
        <span class="pill" id="modePill">Mode: Normal</span>
      </div>
      <div class="controls">
        <label style="display:flex; align-items:center; gap:8px; font-size:17px; color:var(--muted)">
          Mode
          <select id="modeSel">
            <option value="normal" selected>Normal</option>
            <option value="q">Q</option>
            <option value="w">W</option>
            <option value="2g">2G</option>
            <option value="2c">2C</option>
            <option value="2f">2F</option>
          </select>
        </label>
        <label style="display:flex; align-items:center; gap:8px; font-size:17px; color:var(--muted)">
          Size
          <select id="sizeSel"><option>5</option><option>6</option><option selected>7</option><option>8</option></select>
        </label>
        <label style="display:flex; align-items:center; gap:8px; font-size:17px; color:var(--muted)">
          Mines
          <input id="minesInp" type="number" inputmode="numeric" min="0" step="1" style="width:86px"/>
        </label>
        <label style="display:flex; align-items:center; gap:8px; font-size:17px; color:var(--muted)">
          Preset
          <select id="minesPresetSel">
            <option value="">Custom</option><option value="8">8</option><option value="10">10</option><option value="14" selected>14</option><option value="20">20</option><option value="26">26</option>
          </select>
        </label>
        <button id="copyBtn" title="Copy size/mines/board">Copy</button>
        <button id="pasteBtn" title="Paste size/mines/board">Paste</button>
        <button id="clearBtn" title="Clear board">Clear</button>
      </div>
    </div>

    <div class="main">
      <div class="card">
        <div class="boardWrap">
          <div class="axisWrap">
            <div class="axisCorner"></div>
            <div id="axisTop" class="axis axisTop" aria-hidden="true"></div>
            <div id="axisLeft" class="axis axisLeft" aria-hidden="true"></div>
            <div id="board" class="board" tabindex="0" aria-label="board"></div>
          </div>
        </div>
      </div>

      <button id="inferBtn" class="inferBtn" title="Infer">추론</button>

      <div class="card" id="stateCard">
        <div class="sideHead"><button id="stateDumpBtn" class="hBtn" title="Copy State dump">State</button></div>
        <div class="sideMeta">
          <div class="metaRow"><div class="sub" id="selInfo">No selection</div><div class="sub" id="lastInfo">—</div></div>
          <div class="sub" id="fileInfo">File: —</div>
        </div>
        <div id="stateBox" class="sideBody"></div>
        <div class="hint">
          Normal/Q/2G/2C/2F: <span class="kbd">L</span> click cycles <b>empty → ? → 0 → 15 → empty</b>. Keys <span class="kbd">0-9</span> set number. <span class="kbd">R</span> toggles flag.
          <br/>W: <span class="kbd">L</span> selects slot1. Keys <span class="kbd">0-8</span>/<span class="kbd">?</span> fill and advance. <span class="kbd">R</span> toggles flag.
        </div>
      </div>
    </div>
  </div>
</div>

<script src="engine-2g.js"></script>
<script src="engine-q.js"></script>
<script src="engine-2c.js"></script>
<script src="engine-2f.js"></script>
<script>
(() => {
  const boardEl = document.getElementById('board');
  const axisTopEl = document.getElementById('axisTop');
  const axisLeftEl = document.getElementById('axisLeft');
  const modeSel = document.getElementById('modeSel');
  const sizeSel = document.getElementById('sizeSel');
  const minesInp = document.getElementById('minesInp');
  const minesPresetSel = document.getElementById('minesPresetSel');
  const copyBtn = document.getElementById('copyBtn');
  const pasteBtn = document.getElementById('pasteBtn');
  const clearBtn = document.getElementById('clearBtn');
  const inferBtn = document.getElementById('inferBtn');
  const stateBox = document.getElementById('stateBox');
  const selInfo = document.getElementById('selInfo');
  const lastInfo = document.getElementById('lastInfo');
  const fileInfo = document.getElementById('fileInfo');
  const stateDumpBtn = document.getElementById('stateDumpBtn');
  const modePill = document.getElementById('modePill');

  const MODE_DEFS = {
    normal:{label:'Normal', ioMode:'N'},
    q:{label:'Q', ioMode:'Q'},
    w:{label:'W', ioMode:'W'},
    '2g':{label:'2G', ioMode:'2G'},
    '2c':{label:'2C', ioMode:'2C'},
    '2f':{label:'2F', ioMode:'2F'}
  };

  const STATE = {
    mode:'normal',
    n:7,
    mines:0,
    normal:[],
    w:[],
    marks:[],
    sel:{x:null,y:null},
    lastAction:null,
    lastInference:null,
    inferenceBoard:null,
    inferenceMines:null,
    err:null,
    orderActive:false,
    order:[]
  };

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function mkNormalCell(){ return {kind:'empty'}; }
  function mkWCell(){ return {flag:false, slots:[{kind:'empty'},{kind:'empty'},{kind:'empty'},{kind:'empty'}], focus:0}; }
  function labelOf(x,y){ return String.fromCharCode(65+x) + String(y+1); }

  function activeEngine(){
    if(STATE.mode === 'q') return typeof inferQ === 'function' ? ENGINE_Q_VERSION : 'engine-q.js not loaded';
    if(STATE.mode === '2g') return typeof infer2G === 'function' ? ENGINE_2G_VERSION : 'engine-2g.js not loaded';
    if(STATE.mode === '2c') return typeof infer2C === 'function' ? ENGINE_2C_VERSION : 'engine-2c.js not loaded';
    if(STATE.mode === '2f') return typeof infer2F === 'function' ? ENGINE_2F_VERSION : 'engine-2f.js not loaded';
    return 'none';
  }
  function updateEngineInfo(){
    fileInfo.textContent = `Active Engine: ${activeEngine()} | App: ${document.title || 'Solgic3'}`;
  }

  function initBoards(n){
    STATE.n = n;
    STATE.normal = Array.from({length:n}, () => Array.from({length:n}, () => mkNormalCell()));
    STATE.w = Array.from({length:n}, () => Array.from({length:n}, () => mkWCell()));
    STATE.marks = Array.from({length:n}, () => Array.from({length:n}, () => null));
    STATE.order = Array.from({length:n}, () => Array.from({length:n}, () => null));
    STATE.orderActive = false;
    STATE.sel = {x:null,y:null};
    STATE.lastAction = null;
    STATE.lastInference = null;
    STATE.inferenceBoard = null;
    STATE.inferenceMines = null;
    STATE.err = null;
    const cap = n*n;
    STATE.mines = clamp(Math.trunc(+STATE.mines || 0), 0, cap);
    minesInp.max = String(cap);
    minesInp.value = String(STATE.mines);
  }

  function clearMarks(){
    for(let y=0;y<STATE.n;y++) for(let x=0;x<STATE.n;x++) STATE.marks[y][x] = null;
  }
  function clearMarkAt(x,y){ if(STATE.marks[y]) STATE.marks[y][x] = null; }

  function nextOrder(){
    let m = 0;
    for(const row of STATE.order) for(const v of row) if(typeof v === 'number' && v > m) m = v;
    return m + 1;
  }
  function renumberChanges(){
    const changed = [];
    for(let y=0;y<STATE.n;y++) for(let x=0;x<STATE.n;x++) if(STATE.order[y][x] != null) changed.push({x,y,order:STATE.order[y][x]});
    changed.sort((a,b) => a.order-b.order);
    changed.forEach((item,i) => { STATE.order[item.y][item.x] = i+1; });
  }
  function touchOrder(x,y){
    if(!STATE.orderActive) return;
    const current = boardToken(buildIO().board[y][x]);
    if(current === STATE.inferenceBoard[y][x]){
      STATE.order[y][x] = null;
      renumberChanges();
    }
    else if(STATE.order[y][x] == null) STATE.order[y][x] = nextOrder();
  }

  function setMode(m){
    const next = MODE_DEFS[m] ? m : 'normal';
    if(next !== STATE.mode){
      STATE.lastAction = null;
      STATE.lastInference = null;
      STATE.inferenceBoard = null;
      STATE.inferenceMines = null;
      STATE.orderActive = false;
      STATE.err = null;
      for(const row of STATE.order) row.fill(null);
    }
    STATE.mode = next;
    modeSel.value = STATE.mode;
    modePill.textContent = 'Mode: ' + MODE_DEFS[STATE.mode].label;
    clearMarks();
    updateEngineInfo();
    render();
    dump();
  }

  function selectCell(x,y){
    STATE.sel = {x,y};
    if(STATE.mode === 'w') STATE.w[y][x].focus = 0;
    boardEl.focus({preventScroll:true});
    render();
    dump();
  }

  function toggleFlag(x,y){
    STATE.err = null;
    if(STATE.mode === 'w'){
      const c = STATE.w[y][x];
      c.flag = !c.flag;
      c.slots = [{kind:'empty'},{kind:'empty'},{kind:'empty'},{kind:'empty'}];
      c.focus = 0;
      STATE.lastAction = {x,y,value:c.flag ? 'flag' : 'unflag'};
    }else{
      const c = STATE.normal[y][x];
      if(c.kind === 'flag'){
        STATE.normal[y][x] = {kind:'empty'};
        STATE.lastAction = {x,y,value:'empty'};
      }else{
        STATE.normal[y][x] = {kind:'flag'};
        STATE.lastAction = {x,y,value:'flag'};
      }
    }
    touchOrder(x,y);
    render();
    dump();
  }

  function normalLeftClick(x,y){
    const c = STATE.normal[y][x];
    if(c.kind === 'flag') return;
    STATE.err = null;
    if(c.kind === 'empty'){
      STATE.normal[y][x] = {kind:'q'};
      STATE.lastAction = {x,y,value:'?'};
    }else if(c.kind === 'q'){
      STATE.normal[y][x] = {kind:'num', v:0};
      STATE.lastAction = {x,y,value:0};
    }else if(c.kind === 'num'){
      const nv = c.v >= 15 ? null : c.v + 1;
      if(nv == null){
        STATE.normal[y][x] = {kind:'empty'};
        STATE.lastAction = {x,y,value:'empty'};
      }else{
        STATE.normal[y][x] = {kind:'num', v:nv};
        STATE.lastAction = {x,y,value:nv};
      }
    }
    touchOrder(x,y);
  }

  function setNormalByKey(x,y,digit){
    const c = STATE.normal[y][x];
    if(c.kind === 'flag') return;
    STATE.err = null;
    STATE.normal[y][x] = {kind:'num', v:digit};
    STATE.lastAction = {x,y,value:digit,via:'key'};
    touchOrder(x,y);
  }

  function setWSlotAndAdvance(x,y, kind, v){
    const c = STATE.w[y][x];
    if(c.flag) return;
    STATE.err = null;
    const i = clamp(c.focus|0,0,3);
    c.slots[i] = kind === 'q' ? {kind:'q'} : {kind:'num', v:v|0};
    STATE.lastAction = {x,y,slot:i+1,value:kind === 'q' ? '?' : (v|0)};
    c.focus = (i + 1) % 4;
    touchOrder(x,y);
  }

  function onCellMouseDown(e){
    const el = e.target.closest('.cell');
    if(!el) return;
    const x = +el.dataset.x, y = +el.dataset.y;
    e.preventDefault();
    selectCell(x,y);
    clearMarkAt(x,y);

    if(e.button === 2){
      toggleFlag(x,y);
      return;
    }
    if(e.button === 0){
      if(STATE.mode === 'w'){
        STATE.w[y][x].focus = 0;
        STATE.lastAction = {x,y,value:STATE.w[y][x].flag ? 'select(flagged)' : 'select(slot1)'};
      }else{
        normalLeftClick(x,y);
      }
      render();
      dump();
    }
  }

  function render(){
    const n = STATE.n;
    boardEl.dataset.mode = STATE.mode;
    boardEl.style.gridTemplateColumns = `repeat(${n},68px)`;
    axisTopEl.style.gridTemplateColumns = `repeat(${n},68px)`;
    axisLeftEl.style.gridTemplateRows = `repeat(${n},68px)`;
    axisTopEl.innerHTML = '';
    axisLeftEl.innerHTML = '';
    for(let x=0;x<n;x++){
      const d = document.createElement('div');
      d.className = 'al';
      d.textContent = String.fromCharCode(65+x);
      axisTopEl.appendChild(d);
    }
    for(let y=0;y<n;y++){
      const d = document.createElement('div');
      d.className = 'al';
      d.textContent = String(y+1);
      axisLeftEl.appendChild(d);
    }

    boardEl.innerHTML = '';
    for(let y=0;y<n;y++){
      for(let x=0;x<n;x++){
        const cell = document.createElement('div');
        cell.className = 'cell' + (STATE.sel.x === x && STATE.sel.y === y ? ' sel' : '');
        const mark = STATE.marks[y][x];
        if(mark === 'safe') cell.classList.add('markSafe');
        else if(mark === 'mine') cell.classList.add('markMine');
        if(STATE.mode === '2f' && ((x + y) & 1) === 1) cell.classList.add('flowerShade');
        cell.dataset.x = x;
        cell.dataset.y = y;

        if(STATE.mode === 'w'){
          const c = STATE.w[y][x];
          if(c.flag){
            cell.classList.add('flag');
          }else{
            const filled = c.slots.filter(s => s.kind !== 'empty');
            const grid = document.createElement('div');
            grid.className = 'wgrid';
            const pos = filled.length === 1 ? ['center'] : filled.length === 2 ? ['topLeft','topRight'] : filled.length === 3 ? ['topLeft','topRight','bottomCenter'] : ['topLeft','topRight','bottomLeft','bottomRight'];
            filled.slice(0,4).forEach((s,i) => {
              const d = document.createElement('div');
              d.className = 'witem ' + (s.kind === 'q' ? 'q ' : '') + (pos[i] || '');
              d.textContent = s.kind === 'q' ? '?' : String(s.v);
              grid.appendChild(d);
            });
            cell.appendChild(grid);
          }
        }else{
          const c = STATE.normal[y][x];
          if(c.kind === 'flag') cell.classList.add('flag');
          else if(c.kind === 'q' || c.kind === 'num'){
            const t = document.createElement('div');
            t.className = 'val big ' + (c.kind === 'q' ? 'q' : 'n');
            t.textContent = c.kind === 'q' ? '?' : String(c.v);
            cell.appendChild(t);
          }
        }

        if(STATE.orderActive && STATE.order[y][x] != null){
          const b = document.createElement('div');
          b.className = 'ordBadge';
          b.textContent = String(STATE.order[y][x]);
          cell.appendChild(b);
        }

        boardEl.appendChild(cell);
      }
    }

    if(STATE.sel.x == null) selInfo.textContent = 'No selection';
    else if(STATE.mode === 'w') selInfo.textContent = `Selected: (${STATE.sel.x},${STATE.sel.y}) slot=${STATE.w[STATE.sel.y][STATE.sel.x].focus+1}`;
    else selInfo.textContent = `Selected: (${STATE.sel.x},${STATE.sel.y})`;
    if(STATE.err) lastInfo.textContent = STATE.err;
    else if(STATE.lastInference){
      const out = STATE.lastInference;
      lastInfo.textContent = `Inference: ${out.ok === false ? 'ERROR' : out.ok === true ? 'OK' : 'NO ENGINE'} · mine ${(out.mine || []).length} · safe ${(out.safe || []).length}`;
    }else lastInfo.textContent = STATE.lastAction ? 'last: ' + JSON.stringify(STATE.lastAction) : '—';
    requestAnimationFrame(placeInferBtn);
  }

  function placeInferBtn(){
    const main = document.querySelector('.main');
    const stateCard = document.getElementById('stateCard');
    if(!main || !stateCard) return;
    const mainR = main.getBoundingClientRect();
    const gridR = boardEl.getBoundingClientRect();
    const stateR = stateCard.getBoundingClientRect();
    const btnR = inferBtn.getBoundingClientRect();
    const gapMidX = (gridR.right + stateR.left) / 2;
    const gridMidY = gridR.top + gridR.height / 2;
    inferBtn.style.left = `${Math.round(gapMidX - mainR.left - (btnR.width||60)/2)}px`;
    inferBtn.style.top = `${Math.round(gridMidY - mainR.top - (btnR.height||34)/2)}px`;
  }

  function buildIO(){
    const n = STATE.n;
    if(STATE.mode === 'w'){
      return {
        mode:'W',
        size:n,
        mines:STATE.mines,
        board:STATE.w.map(row => row.map(c => {
          if(c.flag) return {t:'f'};
          return {t:'w', s:c.slots.map(sl => sl.kind === 'empty' ? {t:'e'} : sl.kind === 'q' ? {t:'q'} : {t:'n', v:sl.v|0})};
        }))
      };
    }

    const def = MODE_DEFS[STATE.mode] || MODE_DEFS.normal;
    return {
      mode:def.ioMode,
      size:n,
      mines:STATE.mines,
      board:STATE.normal.map(row => row.map(c => {
        if(c.kind === 'empty') return {t:'e'};
        if(c.kind === 'q') return {t:'q'};
        if(c.kind === 'flag') return {t:'f'};
        return {t:'n', v:c.v|0};
      }))
    };
  }

  function parseLabel(v){
    if(v && typeof v === 'object' && Number.isInteger(v.x) && Number.isInteger(v.y)) return {x:v.x,y:v.y};
    if(typeof v !== 'string') return null;
    const m = /^([A-Z])([0-9]+)$/.exec(v.trim());
    if(!m) return null;
    const x = m[1].charCodeAt(0) - 65;
    const y = parseInt(m[2],10) - 1;
    if(x < 0 || y < 0 || x >= STATE.n || y >= STATE.n) return null;
    return {x,y};
  }

  function applyDeductions(out){
    if(!out || typeof out !== 'object') return;
    const io = buildIO();
    for(const item of Array.isArray(out.safe) ? out.safe : []){
      const p = parseLabel(item);
      if(p && io.board[p.y][p.x].t === 'e') STATE.marks[p.y][p.x] = 'safe';
    }
    for(const item of Array.isArray(out.mine) ? out.mine : []){
      const p = parseLabel(item);
      if(p && io.board[p.y][p.x].t === 'e') STATE.marks[p.y][p.x] = 'mine';
    }
  }

  async function copyIO(){
    const txt = JSON.stringify(buildIO());
    try{
      await navigator.clipboard.writeText(txt);
    }catch(_e){
      prompt('Copy JSON', txt);
    }
  }

  async function copyStateDump(){
    const txt = buildStateDump();
    try{
      await navigator.clipboard.writeText(txt);
    }catch(_e){
      prompt('Copy State dump', txt);
    }
  }

  function loadNormalBoard(board,n){
    for(let y=0;y<n;y++){
      for(let x=0;x<n;x++){
        const tok = board?.[y]?.[x] || {t:'e'};
        const c = STATE.normal[y][x];
        if(tok.t === 'q') c.kind = 'q';
        else if(tok.t === 'f') c.kind = 'flag';
        else if(tok.t === 'n'){ c.kind = 'num'; c.v = Math.trunc(+tok.v || 0); }
        else c.kind = 'empty';
      }
    }
  }

  function loadWBoard(board,n){
    for(let y=0;y<n;y++){
      for(let x=0;x<n;x++){
        const tok = board?.[y]?.[x] || {t:'e'};
        const c = STATE.w[y][x];
        c.flag = tok.t === 'f';
        c.focus = 0;
        c.slots = [{kind:'empty'},{kind:'empty'},{kind:'empty'},{kind:'empty'}];
        if(tok.t === 'w' && Array.isArray(tok.s)){
          c.flag = false;
          c.slots = tok.s.slice(0,4).map(sl => {
            if(!sl || sl.t === 'e') return {kind:'empty'};
            if(sl.t === 'q') return {kind:'q'};
            if(sl.t === 'n') return {kind:'num', v:Math.trunc(+sl.v || 0)};
            return {kind:'empty'};
          });
          while(c.slots.length < 4) c.slots.push({kind:'empty'});
        }
      }
    }
  }

  async function pasteIO(){
    let txt = '';
    try{ txt = await navigator.clipboard.readText(); }catch(_e){}
    if(!txt) txt = prompt('Paste JSON');
    if(!txt) return;

    let obj;
    try{ obj = JSON.parse(txt); }catch(_e){ STATE.err = 'Paste failed: invalid JSON'; render(); dump(); return; }

    const n = Math.trunc(+obj.size || 0);
    if(![5,6,7,8].includes(n) || !Array.isArray(obj.board)){
      STATE.err = 'Paste failed: missing or unsupported fields';
      render();
      dump();
      return;
    }

    sizeSel.value = String(n);
    STATE.mines = clamp(Math.trunc(+obj.mines || 0), 0, n*n);
    initBoards(n);
    minesInp.value = String(STATE.mines);
    minesPresetSel.value = ['8','10','14','20','26'].includes(String(STATE.mines)) ? String(STATE.mines) : '';

    const m = String(obj.mode || '').toUpperCase();
    if(m === 'W'){
      setMode('w');
      loadWBoard(obj.board,n);
    }else{
      if(m === 'Q') setMode('q');
      else if(m === '2G') setMode('2g');
      else if(m === '2C') setMode('2c');
      else if(m === '2F') setMode('2f');
      else setMode('normal');
      loadNormalBoard(obj.board,n);
    }

    STATE.err = null;
    STATE.lastAction = {paste:'ok'};
    render();
    dump();
  }

  function boardToken(c){
    if(c.t === 'e') return '.';
    if(c.t === 'q') return '?';
    if(c.t === 'f') return 'F';
    if(c.t === 'n') return String(c.v);
    if(c.t === 'w') return '[' + (c.s || []).map(sl => boardToken(sl)).join('') + ']';
    return '.';
  }

  function buildStateDump(){
    const payload = buildIO();
    const n = payload.size|0;
    const lines = ['SOLGIC STATE v1', '', `MODE: ${payload.mode}`, `ENGINE: ${activeEngine()}`, `SIZE: ${n}x${n}`, `TOTAL MINES: ${payload.mines}`, '', 'LEGEND:', '. = unopened', '? = opened safe', 'F = mine/flag'];
    if(payload.mode === 'W') lines.push('[....] = four W slots in order');
    lines.push('', 'BOARD:', '    ' + Array.from({length:n}, (_,x) => String.fromCharCode(65+x)).join(' '));
    for(let y=0;y<n;y++){
      lines.push(`${y+1} | ${payload.board[y].map(boardToken).join(' ')}`);
    }
    lines.push('', 'CHANGES SINCE LAST INFERENCE:');
    if(!STATE.orderActive) lines.push('(no inference yet)');
    else{
      if(STATE.inferenceMines !== STATE.mines) lines.push(`TOTAL MINES: ${STATE.inferenceMines} -> ${STATE.mines}`);
      const changes = [];
      for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(STATE.order[y][x] != null){
        changes.push({order:STATE.order[y][x], label:labelOf(x,y), value:boardToken(payload.board[y][x])});
      }
      changes.sort((a,b) => a.order-b.order);
      for(const item of changes) lines.push(`${item.order}. ${item.label} = ${item.value}`);
      if(!changes.length && STATE.inferenceMines === STATE.mines) lines.push('(none)');
    }
    lines.push('', 'LAST INFERENCE:');
    const out = STATE.lastInference;
    if(!out) lines.push('STATUS: NONE');
    else{
      lines.push(`STATUS: ${out.ok === false ? 'ERROR' : out.ok === true ? 'OK' : 'NO ENGINE'}`);
      lines.push(`MINE: ${Array.isArray(out.mine) && out.mine.length ? out.mine.join(', ') : '—'}`);
      lines.push(`SAFE: ${Array.isArray(out.safe) && out.safe.length ? out.safe.join(', ') : '—'}`);
      lines.push(`EXHAUSTED: ${typeof out.exhausted === 'boolean' ? out.exhausted : 'unknown'}`);
      if(STATE.inferenceMines !== STATE.mines) lines.push(`TOTAL MINES AT INFERENCE: ${STATE.inferenceMines}`);
      if(out.sol !== undefined) lines.push(`SOLUTIONS: ${out.sol}`);
      if(out.warning) lines.push(`WARNING: ${out.warning}`);
      if(out.note) lines.push(`NOTE: ${out.note}`);
      if(Array.isArray(out.checkLines) && out.checkLines.length){
        lines.push('', 'CHECK:');
        for(const line of out.checkLines) lines.push('- ' + line);
      }
    }
    if(STATE.err) lines.push('', 'INPUT ERROR: ' + STATE.err);
    return lines.join('\n');
  }

  function dump(){
    stateBox.textContent = buildStateDump();
  }

  function onKeyDown(e){
    if(STATE.sel.x == null) return;
    const x = STATE.sel.x, y = STATE.sel.y;
    clearMarkAt(x,y);

    if(e.key === 'r' || e.key === 'R'){
      e.preventDefault();
      toggleFlag(x,y);
      return;
    }

    if(e.key === '?' || e.key === 'q' || e.key === 'Q'){
      e.preventDefault();
      if(STATE.mode === 'w') setWSlotAndAdvance(x,y,'q');
      else{
        if(STATE.normal[y][x].kind !== 'flag'){
          STATE.normal[y][x] = {kind:'q'};
          STATE.lastAction = {x,y,value:'?',via:'key'};
          touchOrder(x,y);
        }
      }
      render();
      dump();
      return;
    }

    if(e.key >= '0' && e.key <= '9'){
      const d = e.key.charCodeAt(0) - 48;
      e.preventDefault();
      if(STATE.mode === 'w'){
        if(d <= 8) setWSlotAndAdvance(x,y,'num',d);
      }else{
        setNormalByKey(x,y,d);
      }
      render();
      dump();
      return;
    }

    if(e.key === 'Backspace' || e.key === 'Delete'){
      e.preventDefault();
      if(STATE.mode === 'w'){
        STATE.w[y][x] = mkWCell();
      }else if(STATE.normal[y][x].kind !== 'flag'){
        STATE.normal[y][x] = {kind:'empty'};
      }
      STATE.err = null;
      STATE.lastAction = {x,y,value:'clear'};
      touchOrder(x,y);
      render();
      dump();
    }
  }

  function inferNow(){
    clearMarks();
    const io = buildIO();
    STATE.orderActive = true;
    STATE.order = Array.from({length:STATE.n}, () => Array.from({length:STATE.n}, () => null));
    STATE.inferenceBoard = io.board.map(row => row.map(boardToken));
    STATE.inferenceMines = STATE.mines;
    let out;
    if(STATE.mode === 'q'){
      if(typeof inferQ !== 'function') out = {ok:false, checkLines:['engine-q.js not loaded'], safe:[], mine:[], sol:0};
      else out = inferQ(io);
    }else if(STATE.mode === '2g'){
      if(typeof infer2G !== 'function') out = {ok:false, checkLines:['engine-2g.js not loaded'], safe:[], mine:[], sol:0};
      else out = infer2G(io);
    }else if(STATE.mode === '2c'){
      if(typeof infer2C !== 'function') out = {ok:false, checkLines:['engine-2c.js not loaded'], safe:[], mine:[], sol:0};
      else out = infer2C(io);
    }else if(STATE.mode === '2f'){
      if(typeof infer2F !== 'function') out = {ok:false, checkLines:['engine-2f.js not loaded'], safe:[], mine:[], sol:0};
      else out = infer2F(io);
    }else{
      out = {note:'(no engine)', safe:[], mine:[]};
    }
    STATE.lastInference = out && typeof out === 'object' ? out : {ok:false, note:'Invalid engine response', safe:[], mine:[]};
    applyDeductions(STATE.lastInference);
    STATE.err = null;
    render();
    dump();
  }

  boardEl.addEventListener('contextmenu', e => e.preventDefault());
  boardEl.addEventListener('mousedown', onCellMouseDown);
  document.addEventListener('keydown', onKeyDown);
  modeSel.addEventListener('change', () => setMode(modeSel.value));
  sizeSel.addEventListener('change', () => { initBoards(+sizeSel.value); render(); dump(); });
  minesInp.addEventListener('change', () => {
    const cap = STATE.n * STATE.n;
    STATE.mines = clamp(Math.trunc(+minesInp.value || 0), 0, cap);
    STATE.err = null;
    minesInp.value = String(STATE.mines);
    STATE.lastAction = {mines:STATE.mines};
    minesPresetSel.value = ['8','10','14','20','26'].includes(String(STATE.mines)) ? String(STATE.mines) : '';
    clearMarks();
    render();
    dump();
  });
  minesPresetSel.addEventListener('change', () => {
    if(!minesPresetSel.value) return;
    minesInp.value = minesPresetSel.value;
    minesInp.dispatchEvent(new Event('change'));
  });
  copyBtn.addEventListener('click', copyIO);
  pasteBtn.addEventListener('click', pasteIO);
  clearBtn.addEventListener('click', () => { initBoards(STATE.n); render(); dump(); });
  stateDumpBtn.addEventListener('click', copyStateDump);
  inferBtn.addEventListener('click', inferNow);
  window.addEventListener('resize', placeInferBtn);

  initBoards(+sizeSel.value || 7);
  minesInp.dispatchEvent(new Event('change'));
  updateEngineInfo();
  setMode('normal');
})();
</script>
</body>
</html>
